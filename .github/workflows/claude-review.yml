name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Counted here, deterministically, instead of asking the model to count.
      - name: Count previous change requests from Claude
        id: rounds
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # One line per review, counted after paging (a per-page `length` would print one number per page).
          count=$(gh api "repos/${{ github.repository }}/pulls/$PR/reviews" --paginate \
            --jq '.[] | select(.user.type == "Bot" and (.user.login | startswith("claude")) and .state == "CHANGES_REQUESTED") | .id' | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PREVIOUS CHANGE REQUESTS FROM YOU ON THIS PR: ${{ steps.rounds.outputs.count }}
            MAX ROUNDS: 3

            You are the independent reviewer for this PR. Another Claude session wrote the
            code; it will read your review and push fixes. The PR branch is already checked
            out in the working directory. Write the whole review in Spanish (rioplatense is
            fine), since that is the language of this repo's issues.

            You review by reading code, not by running it. Do NOT try to run builds, tests,
            gradle, npm or `gh pr checks`: a separate CI job already runs them on this PR, and
            those commands aren't available to you anyway, so attempts only burn turns.

            Your tools - use only these, anything else is denied and wastes turns:
            - Read, Grep and Glob to read code. Never `cat`, `grep`, `ls`, `find` or `head` in Bash.
            - Write, only to create the review body file (step 3).
            - Bash only for single, plain `gh pr view`, `gh pr diff`, `gh pr review`, `gh pr edit`
              and `gh issue view` commands: no pipes, no `&&`, no `$(...)`, no heredocs.

            ## 1. Gather context
            - `gh pr view ${{ github.event.pull_request.number }}` and `gh pr diff ${{ github.event.pull_request.number }}`.
            - Find the linked issue (`Closes #N` in the PR body) and read it with `gh issue view N`.
              Its "Criterios de aceptación" checklist is the contract for this PR.
            - If the diff touches `openspec/changes/<name>/`, read that change's proposal,
              design, specs and tasks, and check the implementation matches them.
            - Read surrounding code as needed to judge correctness, not just the diff lines.

            ## 2. Classify findings
            - BLOCKER: an acceptance criterion not met, a real bug, missing tests for new
              behavior, a security problem, or a mismatch with the OpenSpec change.
            - SUGGESTION: style, naming, optional refactors, nice-to-haves. Never block on these.
            Only report what you can point to concretely. Don't invent problems to look thorough.

            ## 3. Publish
            - One inline comment per finding on the exact line, using
              `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`),
              prefixed with **[Bloqueante]** or **[Sugerencia]**.
            - Then submit exactly ONE formal review. Write its body with the Write tool to
              `.claude-review-body.md` (in the working directory): a short summary, the
              acceptance-criteria checklist marked ✅/❌ one by one, and the list of blockers
              (if any). Then publish it with `--body-file`, never with an inline `--body`:
              - No blockers → `gh pr review ${{ github.event.pull_request.number }} --approve --body-file .claude-review-body.md`
              - Blockers, and PREVIOUS CHANGE REQUESTS < MAX ROUNDS →
                `gh pr review ${{ github.event.pull_request.number }} --request-changes --body-file .claude-review-body.md`
              - Blockers, and PREVIOUS CHANGE REQUESTS >= MAX ROUNDS → do NOT request changes
                again. Run `gh pr edit ${{ github.event.pull_request.number }} --add-label needs-human`
                and submit `gh pr review ${{ github.event.pull_request.number }} --comment --body-file .claude-review-body.md`
                explaining which blockers remain after the round limit, so the repo owner decides.
              If a publish command fails, read the error and retry with a corrected plain command.
            - Don't post anything else (no extra PR comments, no review text as chat output).
          claude_args: |
            --model claude-sonnet-5
            --max-turns 45
            --allowedTools "Read,Glob,Grep,Write,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*),Bash(gh pr edit:*),Bash(gh issue view:*)"

      # Shows only the denied tool calls (tool + truncated input), not the full transcript:
      # the action's full-output mode can leak sensitive data into the log.
      - name: Show denied tool calls
        if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          if [ ! -s "$EXECUTION_FILE" ]; then
            echo "No execution file; nothing to show."
            exit 0
          fi
          denials=$(jq -r '[.[] | select(.type == "result") | .permission_denials[]?]
            | map("- \(.tool_name): \(.tool_input | tostring | .[0:300])") | .[]' "$EXECUTION_FILE")
          if [ -n "$denials" ]; then
            echo "::warning::The reviewer had denied tool calls (see below)."
            echo "$denials"
          else
            echo "No denied tool calls."
          fi

      # The action can end "successfully" without publishing anything (e.g. every publish attempt
      # denied). Fail visibly instead, unless this PR changes the reviewer workflow itself, where
      # the action is expected to skip (GitHub only trusts the workflow already on master).
      - name: Verify a review was published
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate --jq '.[].filename' \
              | grep -qx '.github/workflows/claude-review.yml'; then
            echo "This PR changes the reviewer workflow: the action skips it by design, nothing to verify."
            exit 0
          fi
          # One line per matching review, so --paginate can't split the count across pages.
          published=$(gh api "repos/${{ github.repository }}/pulls/$PR/reviews" --paginate \
            --jq ".[] | select(.commit_id == \"$HEAD_SHA\" and .user.type == \"Bot\" and (.user.login | startswith(\"claude\")))
                  | select(.state == \"APPROVED\" or .state == \"CHANGES_REQUESTED\"
                           or (.state == \"COMMENTED\" and (.body // \"\") != \"\")) | .id" | wc -l)
          if [ "$published" -eq 0 ]; then
            echo "::error::The reviewer finished without publishing a formal review for $HEAD_SHA. Re-run this job."
            exit 1
          fi
          echo "Found $published formal review(s) from the reviewer for $HEAD_SHA."
